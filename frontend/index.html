        watch: "limited visit history" },
      { order: 2, retailer_id: "RTL_00734", tehsil: "Hisar_T009", crop: "mustard",

const MOCK_OUTCOMES = [
  { ts: "2026-05-28 09:42", rep: "REP_012", retailer: "RTL_00045", product: "Score 250 EC", rank: 1, sale: 1, notes: "Sold 8 units. Mustard flowering driving demand." },

  { retailer_id: "RTL_00712", territory: "TER_0089", alert_type: "DEMAND_SPIKE", severity: 0.41,

  { retailer_id: "RTL_00198", territory: "TER_0234", alert_type: "DEMAND_SPIKE", severity: 0.29,
    detail: "Actara 25 WG weekly rate 2.9x baseline." },
];

// ------------------------------------------------------------------------
// Resolved data layer. Prefers live data from build_frontend.py; falls back
// to mock data above. DATA_MODE indicates which is in use.
// ------------------------------------------------------------------------
const TERRITORIES = LIVE?.territories?.length ? LIVE.territories.map(t => ({
  id: t.territory_id, state: t.state, district: t.district, crop: t.crop,
  avg_score: t.avg_score, retailers: t.retailers,
  route_km: t.route_km || 0, alerts: t.alerts || 0
})) : MOCK_TERRITORIES;

const BEAT_PLANS = LIVE?.beat_plans && Object.keys(LIVE.beat_plans).length
  ? LIVE.beat_plans : MOCK_BEAT_PLANS;

const ALL_ALERTS = LIVE?.all_alerts?.length ? LIVE.all_alerts : MOCK_ALL_ALERTS;

const INITIAL_OUTCOMES = LIVE?.outcomes?.length ? LIVE.outcomes.map(o => ({
  ts: o.timestamp || "", rep: o.rep_id || "", retailer: o.retailer_id || "",
  product: o.product_pitched || "", rank: o.recommended_rank || 0,
  sale: parseInt(o.sale_made || 0), notes: o.notes || ""
})) : MOCK_OUTCOMES;

const LIVE_STATS = LIVE?.stats || null;
const DATA_MODE = LIVE ? "live" : "demo";

// ------------------------------------------------------------------------
// Historical snapshots. Weekly topline metrics across the season.
// In live mode these come from build_frontend.py (one snapshot per pipeline
// run, archived). In demo mode they are realistic mock values showing the
// system improving as more outcomes feed the model.
// ------------------------------------------------------------------------
const MOCK_HISTORY = [
  { date: "2025-12-25", label: "Dec 25", ndcg: 0.69, baseline: 0.51, acceptance: 61, stockouts: 21, alerts: 12, avg_score: 46.8, outcomes: 180 },
  { date: "2026-01-01", label: "Jan 01", ndcg: 0.71, baseline: 0.51, acceptance: 64, stockouts: 18, alerts: 14, avg_score: 48.2, outcomes: 410 },
  { date: "2026-01-08", label: "Jan 08", ndcg: 0.73, baseline: 0.51, acceptance: 66, stockouts: 16, alerts: 15, avg_score: 49.6, outcomes: 690 },
  { date: "2026-01-15", label: "Jan 15", ndcg: 0.78, baseline: 0.51, acceptance: 72, stockouts: 12, alerts: 18, avg_score: 51.3, outcomes: 1020 },
  { date: "2026-01-22", label: "Jan 22", ndcg: 0.79, baseline: 0.52, acceptance: 71, stockouts: 11, alerts: 16, avg_score: 52.1, outcomes: 1380 },

  { date: "2026-02-05", label: "Feb 05", ndcg: 0.82, baseline: 0.52, acceptance: 76, stockouts: 8,  alerts: 15, avg_score: 54.0, outcomes: 2140 },
];

const HISTORY = LIVE?.history?.length ? LIVE.history : MOCK_HISTORY;
// Default selected snapshot: the one matching the reference date, else the last.
const DEFAULT_SNAPSHOT_IDX = (() => {
  const refIdx = HISTORY.findIndex(h => h.date === "2026-01-15");
  return refIdx >= 0 ? refIdx : HISTORY.length - 1;
})();

// ------------------------------------------------------------------------
// Brutalist logo: 2x2 grid representing prioritised territories
// ------------------------------------------------------------------------
const Logo = () => (
  <svg className="w-5 h-5 text-black flex-shrink-0" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" strokeWidth="2" strokeLinecap="square">
    <rect x="3"  y="3"  width="8" height="8" fill="currentColor" />
    <rect x="13" y="3"  width="8" height="8" fill="white" stroke="currentColor" strokeWidth="2" />
    <rect x="3"  y="13" width="8" height="8" fill="white" stroke="currentColor" strokeWidth="2" />
    <rect x="13" y="13" width="8" height="8" fill="currentColor" />
    <path d="M11 7 L13 17" stroke="currentColor" strokeWidth="1.2" strokeDasharray="2 2" />
  </svg>
);

const tierColor = (tier) => {
  if (tier === "URGENT") return "#C92A2A";
  if (tier === "IMPORTANT") return "#E67700";
  return "#666666";
};

// ------------------------------------------------------------------------
// Main App
// ------------------------------------------------------------------------
function App() {
  const [view, setView] = useState("dashboard");
  const [selectedTerritory, setSelectedTerritory] = useState(null);
  const [snapIdx, setSnapIdx] = useState(DEFAULT_SNAPSHOT_IDX);

  const snapshot = HISTORY[snapIdx] || HISTORY[HISTORY.length - 1];
  const isLatest = snapIdx === HISTORY.length - 1;

  // Aggregate metrics. Prefer the selected snapshot's numbers, then live, then mock.
  const totalTerritories = LIVE_STATS?.total_territories ?? 500;
  const avgScore = snapshot.avg_score.toFixed(1);
  const totalAlerts = snapshot.alerts;
  const ndcgAt5 = snapshot.ndcg.toFixed(2);
  const baselineNdcg = snapshot.baseline.toFixed(2);

  // Date-aware score adjustment. Earlier snapshots scale territory scores down
  // slightly to reflect that the season and the model were less mature. This
  // is a presentation device in demo mode; in live mode real snapshots replace it.
  const scoreFactor = snapshot.avg_score / HISTORY[DEFAULT_SNAPSHOT_IDX].avg_score;

  const prevSnap = () => setSnapIdx(i => Math.max(0, i - 1));
  const nextSnap = () => setSnapIdx(i => Math.min(HISTORY.length - 1, i + 1));

  const openBeatPlan = (territoryId) => {
    setSelectedTerritory(territoryId);
    setView("beat_plan");
  };

  const backToDashboard = () => {
    setSelectedTerritory(null);
    setView("dashboard");
  };

  return (
    <div className="min-h-screen bg-white text-black flex flex-col md:flex-row font-sans">

      {/* ============ LEFT SIDEBAR ============ */}
      <aside className="w-full md:w-64 border-r border-black flex flex-col justify-between bg-white shrink-0">
        <div>
          <div className="p-6 border-b border-black flex items-center gap-3">
            <Logo />
            <span className="font-sans font-bold text-[15px] tracking-tight uppercase">KshetraAI</span>
          </div>

          <nav className="p-4 space-y-2">
            <NavButton label="Dashboard" active={view === "dashboard"} onClick={() => { setSelectedTerritory(null); setView("dashboard"); }} />
            <NavButton label="Beat Plan" active={view === "beat_plan"} onClick={() => setView("beat_plan")} />
            <NavButton label="CHETAVANI" active={view === "chetavani"} onClick={() => setView("chetavani")} />
            <NavButton label="TRENDS"    active={view === "trends"}    onClick={() => setView("trends")} />
            <NavButton label="SEEKHO"    active={view === "seekho"}    onClick={() => setView("seekho")} />
          </nav>
        </div>

        <div className="p-4 border-t border-black bg-white flex items-center gap-3">
          <div className="w-8 h-8 bg-black text-white flex items-center justify-center font-mono font-bold text-xs">R</div>
          <div className="flex flex-col">
            <span className="text-xs font-medium leading-none">REP_012</span>
            <span className="text-[10px] text-[#666666] font-mono mt-1">Akola territory</span>
          </div>
        </div>
      </aside>

      {/* ============ MAIN PANEL ============ */}
      <main className="flex-1 flex flex-col bg-white min-w-0">

        {/* Header */}
        <header className="h-16 border-b border-black px-6 flex items-center justify-between bg-white">
          <div className="flex items-center gap-2">
            <h1 className="font-sans text-[15px] font-bold uppercase tracking-wider">
              {view === "dashboard" && "Dashboard"}
              {view === "beat_plan" && "Beat Plan"}
              {view === "chetavani" && "CHETAVANI Alerts"}
              {view === "trends" && "Trends"}
              {view === "seekho" && "SEEKHO Outcome Log"}
            </h1>
            {selectedTerritory && view === "beat_plan" && (
              <span className="font-mono text-xs bg-[#F5F5F5] border border-black px-2 py-0.5">
                // VIEWING: {selectedTerritory}
              </span>
            )}
          </div>

          <div className="flex items-center gap-3">
            {/* Snapshot date stepper */}
            <div className="flex items-stretch border border-black font-mono text-xs">
              <button onClick={prevSnap} disabled={snapIdx === 0}
                className={`px-2 border-r border-black ${snapIdx === 0 ? "text-[#CCCCCC]" : "hover:bg-[#F5F5F5]"}`}
                aria-label="previous snapshot">◀</button>
              <span className="px-3 py-1.5 flex items-center gap-2">
                <span className="text-[#666666]">as of</span>
                <span className="font-bold">{snapshot.date}</span>
                {isLatest && <span className="text-[#0D7A5F]">·latest</span>}
              </span>
              <button onClick={nextSnap} disabled={isLatest}
                className={`px-2 border-l border-black ${isLatest ? "text-[#CCCCCC]" : "hover:bg-[#F5F5F5]"}`}
                aria-label="next snapshot">▶</button>
            </div>

            <div className="flex items-center gap-2 border border-black px-3 py-1.5 text-xs font-mono bg-white">
              <span className={`w-2 h-2 inline-block ${DATA_MODE === "live" ? "bg-[#0D7A5F]" : "bg-white border border-black"}`}></span>
              {DATA_MODE === "live" ? "Live data" : "Demo data"}
            </div>
          </div>
        </header>

        {/* Body */}
        <div className="p-6 space-y-6 flex-1 max-w-7xl w-full mx-auto">

          {/* === DASHBOARD === */}
          {view === "dashboard" && (
            <Dashboard
              totalTerritories={totalTerritories}
              avgScore={avgScore}
              totalAlerts={totalAlerts}
              ndcgAt5={ndcgAt5}
              baselineNdcg={baselineNdcg}
              scoreFactor={scoreFactor}
              isLatest={isLatest}
              snapDate={snapshot.date}
              onOpenTerritory={openBeatPlan}
            />
          )}

          {/* === BEAT PLAN === */}
          {view === "beat_plan" && (
            <BeatPlan
              territoryId={selectedTerritory || "TER_0048"}
              scoreFactor={scoreFactor}
              snapDate={snapshot.date}
              isLatest={isLatest}
              onBack={backToDashboard}
              onSelectTerritory={(id) => setSelectedTerritory(id)}
            />
          )}

          {/* === CHETAVANI === */}
          {view === "chetavani" && <ChetavaniView />}

          {/* === TRENDS === */}
          {view === "trends" && <TrendsView snapIdx={snapIdx} onPickSnap={setSnapIdx} />}

          {/* === SEEKHO === */}
          {view === "seekho" && <SeekhoView />}

          <footer className="pt-2 border-t border-[#E5E5E5]">
            <p className="text-[11px] text-[#666666] leading-relaxed">
              {DATA_MODE === "live" ? (
                <>
                  <span className="text-[#0D7A5F] font-bold">Live pipeline data:</span>{" "}
                  Loaded from{" "}
                  <span className="font-mono bg-[#F5F5F5] border border-black px-1.5 py-0.5 text-black text-[10px]">frontend/data.js</span>{" "}
                  generated by{" "}
                  <span className="font-mono bg-[#F5F5F5] border border-black px-1.5 py-0.5 text-black text-[10px]">build_frontend.py</span>{" "}
                  on{" "}
                  <span className="font-mono">{(LIVE?.generated_at || "").slice(0, 19).replace("T", " ")}</span>.
                </>
              ) : (
                <>
                  <span className="text-[#0066CC] font-bold">Demo data:</span>{" "}
                  Run{" "}
                  <span className="font-mono bg-[#F5F5F5] border border-black px-1.5 py-0.5 text-black text-[10px]">python run_pipeline.py</span>{" "}
                  then{" "}
                  <span className="font-mono bg-[#F5F5F5] border border-black px-1.5 py-0.5 text-black text-[10px]">python build_frontend.py</span>{" "}
                  to wire real outputs into this view.
                </>
              )}
            </p>
          </footer>
        </div>
      </main>
    </div>
  );
}

// ------------------------------------------------------------------------
// Nav button
// ------------------------------------------------------------------------
function NavButton({ label, active, onClick }) {
  return (
    <button
      onClick={onClick}
      className={`w-full flex items-center px-4 py-3 border text-sm font-medium transition-colors
        ${active ? "bg-black text-white border-black" : "bg-white text-black border-transparent hover:bg-[#F5F5F5] hover:border-black"}`}
    >
      {label}
    </button>
  );
}

// ------------------------------------------------------------------------
// Dashboard view
// ------------------------------------------------------------------------
function Dashboard({ totalTerritories, avgScore, totalAlerts, ndcgAt5, baselineNdcg, scoreFactor, isLatest, snapDate, onOpenTerritory }) {
  const adj = (s) => Math.round(s * scoreFactor * 10) / 10;
  return (
    <>
      {!isLatest && (
        <div className="border border-black bg-[#F5F5F5] px-4 py-2 flex items-center gap-2">
          <span className="font-mono text-xs font-bold">HISTORICAL VIEW</span>
          <span className="font-mono text-xs text-[#666666]">
            showing the snapshot as of {snapDate}. Step forward to latest for current numbers.
          </span>
        </div>
      )}

      {/* Stats row */}
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard label="Territories active"     value={totalTerritories} footnote="500 reps deployed"                   footColor="#666666" />
        <StatCard label="Avg priority score"     value={avgScore}         footnote={`0-100 scale · as of ${snapDate}`}    footColor="#0D7A5F" />
        <StatCard label="Anomaly alerts"         value={totalAlerts}      footnote="priority ranked CHETAVANI feed"       footColor="#C92A2A" />
        <StatCard label="NDCG @ 5"               value={ndcgAt5}          footnote={`LambdaRank vs ${baselineNdcg} baseline`} footColor="#0D7A5F" />
      </div>

      {/* Top territories table */}
      <div className="border border-black bg-white overflow-x-auto">
        <table className="w-full border-collapse text-left text-sm">
          <thead className="bg-white border-b border-black">
            <tr>
              <th className="p-3 font-mono text-[12px] text-black uppercase tracking-wider font-normal w-[14%]">territory_id</th>
              <th className="p-3 font-mono text-[12px] text-black uppercase tracking-wider font-normal w-[22%]">state · district</th>
              <th className="p-3 font-mono text-[12px] text-black uppercase tracking-wider font-normal w-[12%]">dominant_crop</th>
              <th className="p-3 font-mono text-[12px] text-black uppercase tracking-wider font-normal w-[12%]">avg_score</th>
              <th className="p-3 font-mono text-[12px] text-black uppercase tracking-wider font-normal w-[10%]">retailers</th>

              <th className="p-3 font-mono text-[12px] text-black uppercase tracking-wider font-normal w-[8%]"></th>

  const plan = {
    ...rawPlan,

      const adjScore = Math.round(s.score * scoreFactor * 10) / 10;
      return { ...s, score: adjScore, tier: adjScore >= 66 ? "URGENT" : adjScore >= 40 ? "IMPORTANT" : "MONITOR" };

// ------------------------------------------------------------------------
// TRENDS view -- time series across weekly snapshots
// ------------------------------------------------------------------------
function TrendsView({ snapIdx, onPickSnap }) {
  const data = HISTORY;
  const latest = data[data.length - 1];
  const first = data[0];

  // SVG line chart geometry
  const W = 720, H = 220, padL = 44, padR = 16, padT = 16, padB = 36;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const yMin = 0.4, yMax = 0.9;
  const xFor = (i) => padL + (i / (data.length - 1)) * plotW;
  const yFor = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * plotH;

  const ndcgPath = data.map((d, i) => `${i === 0 ? "M" : "L"} ${xFor(i).toFixed(1)} ${yFor(d.ndcg).toFixed(1)}`).join(" ");
  const basePath = data.map((d, i) => `${i === 0 ? "M" : "L"} ${xFor(i).toFixed(1)} ${yFor(d.baseline).toFixed(1)}`).join(" ");

  const delta = (a, b, suffix = "") => {
    const d = a - b;
    const sign = d > 0 ? "+" : "";
    return `${sign}${d.toFixed(suffix === "%" ? 0 : 2)}${suffix}`;
  };

  return (
    <>
      {/* Topline deltas */}
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <TrendCard label="NDCG @ 5"        value={latest.ndcg.toFixed(2)}     delta={delta(latest.ndcg, first.ndcg)}        up={latest.ndcg > first.ndcg} />
        <TrendCard label="Acceptance rate" value={`${latest.acceptance}%`}     delta={delta(latest.acceptance, first.acceptance, "%")} up={latest.acceptance > first.acceptance} />
        <TrendCard label="Stockouts/month" value={latest.stockouts}           delta={delta(latest.stockouts, first.stockouts)}        up={latest.stockouts < first.stockouts} invert />
        <TrendCard label="Outcomes logged" value={latest.outcomes.toLocaleString()} delta={`+${(latest.outcomes - first.outcomes).toLocaleString()}`} up={true} />
      </div>

      {/* NDCG line chart */}
      <div className="border border-black bg-white p-5">
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-[12px] font-mono uppercase tracking-wider text-[#666666]">Model performance over time</h3>
          <div className="flex items-center gap-4 font-mono text-[11px]">
            <span className="flex items-center gap-1.5"><span className="w-4 h-[2px] bg-black inline-block"></span> NDCG@5 (model)</span>
            <span className="flex items-center gap-1.5"><span className="w-4 h-[2px] inline-block" style={{ background: "#999", borderTop: "1px dashed #999" }}></span> baseline</span>
          </div>
        </div>

        <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ maxHeight: 260 }}>
          {/* y gridlines */}
          {[0.4, 0.5, 0.6, 0.7, 0.8, 0.9].map(v => (
            <g key={v}>
              <line x1={padL} y1={yFor(v)} x2={W - padR} y2={yFor(v)} stroke="#EEEEEE" strokeWidth="1" />
              <text x={padL - 8} y={yFor(v) + 3} textAnchor="end" fontSize="10" fontFamily="monospace" fill="#999">{v.toFixed(1)}</text>
            </g>
          ))}
          {/* baseline line (dashed) */}
          <path d={basePath} fill="none" stroke="#999999" strokeWidth="1.5" strokeDasharray="4 3" />
          {/* ndcg line (solid black) */}
          <path d={ndcgPath} fill="none" stroke="#000000" strokeWidth="2" />
          {/* points + x labels */}
          {data.map((d, i) => (
            <g key={i} style={{ cursor: "pointer" }} onClick={() => onPickSnap(i)}>
              <rect x={xFor(i) - 5} y={yFor(d.ndcg) - 5} width="10" height="10"
                    fill={i === snapIdx ? "#000000" : "#FFFFFF"} stroke="#000000" strokeWidth="1.5" />
              <text x={xFor(i)} y={H - 18} textAnchor="middle" fontSize="10" fontFamily="monospace"
                    fill={i === snapIdx ? "#000000" : "#999999"} fontWeight={i === snapIdx ? "bold" : "normal"}>
                {d.label}
              </text>
            </g>
          ))}
        </svg>
        <p className="text-[11px] font-mono text-[#666666] mt-2">
          Click any point to load that snapshot across all views. Model climbed from{" "}
          <span className="text-black font-bold">{first.ndcg.toFixed(2)}</span> to{" "}
          <span className="text-black font-bold">{latest.ndcg.toFixed(2)}</span> as outcomes accumulated through SEEKHO.
        </p>
      </div>

      {/* Weekly snapshot table */}
      <div className="border border-black bg-white overflow-x-auto">
        <table className="w-full border-collapse text-left text-sm">
          <thead className="bg-white border-b border-black">
            <tr>
              <th className="p-3 font-mono text-[12px] uppercase tracking-wider font-normal">snapshot</th>
              <th className="p-3 font-mono text-[12px] uppercase tracking-wider font-normal">ndcg@5</th>
              <th className="p-3 font-mono text-[12px] uppercase tracking-wider font-normal">acceptance</th>
              <th className="p-3 font-mono text-[12px] uppercase tracking-wider font-normal">stockouts</th>
              <th className="p-3 font-mono text-[12px] uppercase tracking-wider font-normal">alerts</th>
              <th className="p-3 font-mono text-[12px] uppercase tracking-wider font-normal">avg_score</th>
              <th className="p-3 font-mono text-[12px] uppercase tracking-wider font-normal">outcomes</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-black">
            {data.map((d, i) => (
              <tr key={d.date} onClick={() => onPickSnap(i)}
                  className={`cursor-pointer ${i === snapIdx ? "bg-[#F5F5F5]" : "hover:bg-[#F5F5F5]"}`}>
                <td className="p-3 font-mono text-xs font-bold">{d.date}{i === data.length - 1 && <span className="text-[#0D7A5F] ml-1">·latest</span>}</td>
                <td className="p-3 font-mono text-xs">{d.ndcg.toFixed(2)}</td>
                <td className="p-3 font-mono text-xs">{d.acceptance}%</td>
                <td className="p-3 font-mono text-xs">{d.stockouts}</td>
                <td className="p-3 font-mono text-xs">{d.alerts}</td>
                <td className="p-3 font-mono text-xs">{d.avg_score.toFixed(1)}</td>
                <td className="p-3 font-mono text-xs text-[#666666]">{d.outcomes.toLocaleString()}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="border border-[#E5E5E5] p-3 bg-[#F5F5F5]">
        <p className="text-[11px] font-mono text-[#666666] leading-relaxed">
          This is the SEEKHO loop made visible. Each snapshot is one pipeline run. As reps log outcomes,
          the model retrains and NDCG@5 climbs while stockouts fall. In demo mode these are realistic mock
          snapshots; in live mode build_frontend.py archives one snapshot per run.
        </p>
      </div>
    </>
  );
}

}

          <tbody className="divide-y divide-black">
            {outcomes.map((o, i) => (
              <tr key={i} className="hover:bg-[#F5F5F5]">
                <td className="p-3 font-mono text-[11px] text-[#666666] whitespace-nowrap">{o.ts}</td>
                <td className="p-3 font-mono text-xs">{o.rep}</td>
                <td className="p-3 font-mono text-xs font-bold">{o.retailer}</td>
                <td className="p-3 font-sans text-[13px]">{o.product}</td>
                <td className="p-3 font-mono text-xs">{o.rank || "—"}</td>
                <td className="p-3">
                  {o.sale === 1 ? (
                    <span className="font-mono text-[11px] px-2 py-0.5 border border-black text-[#0D7A5F]">SOLD</span>
                  ) : (
                    <span className="font-mono text-[11px] px-2 py-0.5 border border-black text-[#666666]">—</span>
                  )}
                </td>
                <td className="p-3 font-sans text-[12px] text-[#666666]">{o.notes}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="border border-[#E5E5E5] p-3 bg-[#F5F5F5]">
        <p className="text-[11px] font-mono text-[#666666] leading-relaxed">
          SEEKHO writes one row per closed visit. Schema: timestamp, rep_id, retailer_id,
          product_pitched, recommended_rank, sale_made, notes. The retraining job reads this CSV
          to refresh the LambdaRank model after every 500 outcomes accumulate.
        </p>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
