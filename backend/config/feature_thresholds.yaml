# Build 02 feature threshold configuration.
#
# This file defines shared threshold bands and per-feature configuration keys.
# It does not implement feature calculations, prioritization, recommendations,
# anomaly detection, or explainability text generation.

score_range:
  min: 0
  max: 100

score_bands:
  low:
    min: 0
    max: 30
  moderate:
    min: 31
    max: 60
  high:
    min: 61
    max: 80
  critical:
    min: 81
    max: 100

feature_defaults:
  missing_numeric_value: null
  missing_category_value: unknown
  clamp_scores_to_range: true
  deterministic_sort_keys:
    - entity_id
    - territory_id

features:
  weather_risk_score:
